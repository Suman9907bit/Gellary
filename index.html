10-rw", "caption": "Sudhu Plastiker gach niye vabna"}, {"src": "https://lh3.googleusercontent.com/p/AF1QipNoOclAhUWRIObTFcaAtTQlj-CpqJAuE7m3tmM1=s680-w680-h510-rw", "caption": "Eita chorte parlam na. photo tule sadh miteye nilam"}, {"src": "https://lh3.googleusercontent.com/p/AF1QipPaQ9CT4fI5eombY0X6A97GNq-dzW2Yryc2w6j5=s680-w680-h510-rw", "caption": "pase bosar keo nei"}, {"src": "https://lh3.googleusercontent.com/p/AF1QipMe9E8lXZ0vDOl7MF_KO4PJvLOrx0BMBPQ5UVrS=s680-w680-h510-rw", "caption": "Puri diye chosma ta kinlam"}];
const gallery=document.getElementById('gallery'), searchInput=document.getElementById('searchInput');
const viewer=document.getElementById('viewer'), viewerImage=document.getElementById('viewerImage'), viewerCaption=document.getElementById('viewerCaption'), viewerCount=document.getElementById('viewerCount');
let filtered=photos.slice(), currentIndex=0, lastFocus=null;
document.getElementById('totalCount').textContent=String(photos.length).padStart(2,'0');document.getElementById('year').textContent=new Date().getFullYear();
function render(){const q=searchInput.value.trim().toLocaleLowerCase();filtered=photos.map((p,i)=>({...p,originalIndex:i})).filter(p=>p.caption.toLocaleLowerCase().includes(q));document.getElementById('resultCount').textContent=`${filtered.length} টি ছবি`;gallery.replaceChildren();if(!filtered.length){const e=document.createElement('div');e.className='empty';e.textContent='কোনো ছবি পাওয়া যায়নি। অন্য শব্দ দিয়ে খুঁজুন।';gallery.append(e);return;}const frag=document.createDocumentFragment();filtered.forEach((p,i)=>{const card=document.createElement('article');card.className='card';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',p.caption+' — বড় করে দেখুন');card.style.animationDelay=Math.min(i%12,8)*35+'ms';const photo=document.createElement('div');photo.className='photo';const img=document.createElement('img');img.src=p.src;img.alt=p.caption;img.loading=i<6?'eager':'lazy';img.decoding='async';img.referrerPolicy='no-referrer';img.onerror=()=>{img.style.opacity='.2';};const num=document.createElement('span');num.className='number';num.textContent=String(p.originalIndex+1).padStart(2,'0');const zoom=document.createElement('span');zoom.className='zoom';zoom.textContent='↗';photo.append(img,num,zoom);const cap=document.createElement('div');cap.className='caption';const title=document.createElement('h2');title.textContent=p.caption||'Jana Online Service';const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';cap.append(title,arrow);card.append(photo,cap);card.addEventListener('click',()=>openViewer(i));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openViewer(i);}});frag.append(card);});gallery.append(frag);}
function openViewer(i){currentIndex=i;lastFocus=document.activeElement;updateViewer();viewer.classList.add('open');document.body.style.overflow='hidden';document.getElementById('closeViewer').focus();}
function updateViewer(){const p=filtered[currentIndex];if(!p)return;viewerImage.src=p.src;viewerImage.alt=p.caption;viewerCaption.textContent=p.caption;viewerCount.textContent=`${currentIndex+1} / ${filtered.length}`;}
function closeViewer(){viewer.classList.remove('open');document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus();}
function move(step){if(!filtered.length)return;currentIndex=(currentIndex+step+filtered.length)%filtered.length;updateViewer();}
searchInput.addEventListener('input',render);document.getElementById('closeViewer').addEventListener('click',closeViewer);document.getElementById('prevImage').addEventListener('click',()=>move(-1));document.getElementById('nextImage').addEventListener('click',()=>move(1));viewer.addEventListener('click',e=>{if(e.target===viewer)closeViewer();});document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);});let touchX=0;viewer.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;},{passive:true});viewer.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>60)move(dx<0?1:-1);},{passive:true});render();
